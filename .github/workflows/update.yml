name: update-au-packages
on:
  workflow_dispatch:
  schedule:
    - cron: '30 5 * * 0'  # Weekly on Sunday at 5:30 AM UTC
permissions:
  contents: write
jobs:
  update:
    runs-on: windows-latest
    env:
      au_Push: 'true'
      au_ForcePush: 'false'
      GH_TOKEN: ${{ github.token }}
      github_api_key: ${{ secrets.API_KEY }}
      api_key: ${{ secrets.CHOCOLATEY_API_KEY }}
      gist_id: 7c671e5b6c0431b43e29fe2446e212c4
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - shell: pwsh
        run: Install-Module -Name AU -Force -Scope CurrentUser
      - shell: pwsh
        run: ${{ github.workspace }}\_elixir-gen\generate-packages.ps1
      - shell: pwsh
        run: ${{ github.workspace }}\update_all.ps1
      - if: always()
        shell: pwsh
        run: |
          Write-Host "=== Generated Packages ==="
          Get-ChildItem elixir* -Directory | ForEach-Object { Write-Host $_.Name }
          Write-Host ""
          Write-Host "=== Nuspec Versions ==="
          Get-ChildItem elixir*\*.nuspec | ForEach-Object {
            $version = Select-String -Path $_ -Pattern "<version>(.*)</version>" | ForEach-Object { $_.Matches.Groups[1].Value }
            Write-Host "$($_.Directory.Name): $version"
          }
          Write-Host ""
          Write-Host "=== Nupkg Files ==="
          Get-ChildItem elixir*\*.nupkg -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.FullName }
