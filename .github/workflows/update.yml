name: update-au-packages
on:
  workflow_dispatch:
  schedule:
    - cron: '30 5 * * *'  # Daily at 5:30 AM UTC
permissions:
  contents: write
jobs:
  update:
    runs-on: windows-latest
    env:
      au_Push: 'true'
      GH_TOKEN: ${{ github.token }}
      github_api_key: ${{ secrets.API_KEY }}
      github_user_repo: chocolatey-beam/au-packages
      api_key: ${{ secrets.CHOCOLATEY_API_KEY }}
      gist_id: 7c671e5b6c0431b43e29fe2446e212c4
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          submodules: true
      - name: Update-Packages.ps1
        shell: pwsh
        run: ${{ github.workspace }}\Update-Packages.ps1
