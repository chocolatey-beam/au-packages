name: update-au-packages
on:
  workflow_dispatch:
  schedule:
    - cron: '30 5 * * *'  # Daily at 5:30 AM UTC
permissions:
  contents: write
jobs:
  update:
    runs-on: windows-latest
    env:
      au_Push: 'true'
      GH_TOKEN: ${{ github.token }}
      github_api_key: ${{ secrets.API_KEY }}
      github_user_repo: chocolatey-beam/au-packages
      api_key: ${{ secrets.CHOCOLATEY_API_KEY }}
      gist_id: ${{ secrets.GIST_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - shell: pwsh
        run: |
          git config --global user.email "lukerbakken@gmail.com"
          git config --global user.name "Luke Bakken"
      - name: check-otp-version
        shell: pwsh
        run: ${{ github.workspace }}\Test-LatestOtpVersion.ps1
      - name: Update-Packages.ps1
        shell: pwsh
        run: ${{ github.workspace }}\Update-Packages.ps1
